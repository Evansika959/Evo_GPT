  mlp_size_layerlist: [768, 3584, 3584, 3584, 3584, 3584, 3584]
  n_qk_head_dim_layerlist: [320, 224, 224, 224, 224, 224, 224]
  n_v_head_dim_layerlist: [480, 192, 192, 192, 192, 192, 192]
  n_cproj_layerlist: [1, 1, 1, 1, 1, 1, 1]
  attention_variant_layerlist:
    [infinite, infinite, infinite, infinite, infinite, infinite, infinite]

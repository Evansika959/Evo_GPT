      \ = re.sub(r\"/' [0-9]/\", r\"/'[0-9]/\", string)\n    # number separators\n\
      \    string = string.replace(\" @-@ \", \"-\")\n    string = string.replace(\"\
      \ @,@ \", \",\")\n    string = string.replace(\" @.@ \", \".\")\n    # punctuation\n\
      \    string = string.replace(\" : \", \": \")\n    string = string.replace(\"\
      \ ; \", \"; \")\n    string = string.replace(\" . \", \". \")\n    string =\
      \ string.replace(\" ! \", \"! \")\n    string = string.replace(\" ? \", \"?\
      \ \")\n    string = string.replace(\" , \", \", \")\n    # double brackets\n\
      \    string = re.sub(r\"\\(\\s*([^\\)]*?)\\s*\\)\", r\"(\\1)\", string)\n  \
      \  string = re.sub(r\"\\[\\s*([^\\]]*?)\\s*\\]\", r\"[\\1]\", string)\n    string\
      \ = re.sub(r\"{\\s*([^}]*?)\\s*}\", r\"{\\1}\", string)\n    string = re.sub(r\"\
      \\\"\\s*([^\\\"]*?)\\s*\\\"\", r'\"\\1\"', string)\n    string = re.sub(r\"\
      '\\s*([^']*?)\\s*'\", r\"'\\1'\", string)\n    # miscellaneous\n    string =\
      \ string.replace(\"= = = =\", \"====\")\n    string = string.replace(\"= = =\"\
      , \"===\")\n    string = string.replace(\"= =\", \"==\")\n    string = string.replace(\"\
      \ \" + chr(176) + \" \", chr(176))\n    string = string.replace(\" \\n\", \"\
      \\n\")\n    string = string.replace(\"\\n \", \"\\n\")\n    string = string.replace(\"\
      \ N \", \" 1 \")\n    string = string.replace(\" 's\", \"'s\")\n\n    return\
      \ string\n"
    unsafe_code: false
    process_results: "def process_results(doc, results):\n    (loglikelihood,) = results\n\

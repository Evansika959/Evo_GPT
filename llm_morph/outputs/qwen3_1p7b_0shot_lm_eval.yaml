configs:
  gsm8k:
    task: gsm8k
    tag:
    - math_word_problems
    dataset_path: openai/gsm8k
    dataset_name: main
    training_split: train
    test_split: test
    fewshot_split: train
    doc_to_text: 'Question: {{question}}

      Answer:'
    doc_to_target: '{{answer}}'
    unsafe_code: false
    description: ''
    target_delimiter: ' '
    fewshot_delimiter: '


      '
    fewshot_config:
      sampler: default
      split: train
      process_docs: null
      fewshot_indices: null
      samples: null
      doc_to_text: 'Question: {{question}}

        Answer:'
      doc_to_choice: null
      doc_to_target: '{{answer}}'
      gen_prefix: null
      fewshot_delimiter: '


        '
      target_delimiter: ' '
    num_fewshot: 0
    metric_list:
    - metric: exact_match
      aggregation: mean
      higher_is_better: true
      ignore_case: true
      ignore_punctuation: false
      regexes_to_ignore:
      - ','
      - \$
      - '(?s).*#### '
      - \.$
    output_type: generate_until
    generation_kwargs:
      until:
      - 'Question:'
      - </s>
      - <|im_end|>
      do_sample: false
      temperature: 0.0
      max_gen_toks: 256
    repeats: 1
    filter_list:
    - name: strict-match
      filter:
      - function: regex
        regex_pattern: '#### (\-?[0-9\.\,]+)'
      - function: take_first
    - name: flexible-extract
      filter:
      - function: regex
        group_select: -1
        regex_pattern: (-?[$0-9.,]{2,})|(-?[0-9]+)
      - function: take_first
    should_decontaminate: false
    metadata:
      version: 3.0
      pretrained: Qwen/Qwen3-1.7B
      dtype: bfloat16
      trust_remote_code: true
      device: cuda
      attn_implementation: sdpa
  mbpp:
    task: mbpp
    dataset_path: google-research-datasets/mbpp
    dataset_name: full
    test_split: test
    doc_to_text: 'You are an expert Python programmer, and here is your task: {{text}}
      Your code should pass these tests:


      {{test_list[0]}}

      {{test_list[1]}}

      {{test_list[2]}}

      [BEGIN]

      '
    doc_to_target: '{% if is_fewshot is defined %}{{code}}

      [DONE]{% else %}{{test_list[0]}}

      {{test_list[1]}}

      {{test_list[2]}}{% endif %}'
    unsafe_code: true
    description: ''
    target_delimiter: ''
    fewshot_delimiter: '


      '
    fewshot_config:
      sampler: first_n
      split: null
      process_docs: null
      fewshot_indices: null
      samples: <function list_fewshot_samples at 0x7dd3a8eec5e0>
      doc_to_text: 'You are an expert Python programmer, and here is your task: {{text}}
        Your code should pass these tests:


        {{test_list[0]}}

        {{test_list[1]}}

        {{test_list[2]}}

        [BEGIN]

        '
      doc_to_choice: null
      doc_to_target: '{% if is_fewshot is defined %}{{code}}

        [DONE]{% else %}{{test_list[0]}}

        {{test_list[1]}}

        {{test_list[2]}}{% endif %}'
      gen_prefix: null
      fewshot_delimiter: '


        '
      target_delimiter: ''
    num_fewshot: 0
    metric_list:
    - metric: "def pass_at_1(\n    references: Union[str, list[str]], predictions:\
        \ Union[str, list[list[str]]]\n) -> float:\n    if isinstance(references,\
        \ str):\n        references = [references]\n    if isinstance(predictions[0],\
        \ str):\n        predictions = [[p] for p in predictions]\n    return pass_at_k.compute(\n\
        \        references=references,\n        predictions=predictions,\n      \
        \  k=[1],\n    )[0][\"pass@1\"]\n"
      aggregation: mean
      higher_is_better: true
    output_type: generate_until
    generation_kwargs:
      until:
      - '[DONE]'
      do_sample: false
      max_gen_toks: 256
    repeats: 1
    should_decontaminate: false
    metadata:
      version: 1.0
      pretrained: Qwen/Qwen3-1.7B
      dtype: bfloat16
      trust_remote_code: true
      device: cuda
      attn_implementation: sdpa

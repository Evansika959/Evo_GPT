dumped_by_timeloop_front_end: true
architecture:
    version: '0.4'
    subtree:
      - name: System_top_level
        attributes:
            version: '0.4'
            global_cycle_seconds: 1e-9
            technology: "32nm"
            EMBEDDING: 1024
            SEQ_LENGTH: 4096
            HEADS: 16
            FF_DIM: 4096
            EMBEDDING_HEADS: 64
            EMBEDDING_3: 3072
            MB_D: 1
            MB_E: 1
            MB_L: 1
            latency: "1ns"
            has_power_gating: false
            power_gated_at: null
        local:
          - name: DRAM[1..1]
            class: DRAM
            attributes:
                type: "LPDDR4"
                instances: 1
                datawidth: 8
                width: 64
                read_bandwidth: 4
                write_bandwidth: 4
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 1
                latency: "1ns"
                power_gated_at: null
            required_actions:
              - write
              - update
              - leak
              - read
            enabled: true
          - name: Scratchpad[1..1]
            class: SRAM
            attributes:
                entries: 524288
                depth: 32768
                width: 128
                instances: 1
                meshX: 1
                datawidth: 8
                n_rdwr_ports: 2
                n_banks: 4
                read_bandwidth: 16
                write_bandwidth: 16
                network_fill_latency: 1
                network_drain_latency: 1
                has_power_gating: false
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshY: 1
                latency: "1ns"
                power_gated_at: null
                technology: "32nm"
            required_actions:
              - write
              - update
              - leak
              - read
            enabled: true
          - name: inter_PERows_spatial[1..1]
            class: dummy_storage
            attributes:
                width: 1
                depth: 1
                datawidth: 1
                technology: -1
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 1
                latency: "1ns"
                power_gated_at: null
            enabled: true
          - name: Accumulator[1..16]
            class: SRAM
            attributes:
                entries: 4096
                depth: 4096
                width: 32
                datawidth: 32
                network_word_bits: 16
                n_rdwr_ports: 2
                n_banks: 2
                read_bandwidth: 4
                write_bandwidth: 4
                meshY: 16
                network_fill_latency: 1
                network_drain_latency: 1
                has_power_gating: false
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                latency: "1ns"
                power_gated_at: null
                technology: "32nm"
            required_actions:
              - write
              - update
              - leak
              - read
            enabled: true
          - name: inter_PECols_spatial[1..16]
            class: dummy_storage
            attributes:
                width: 1
                depth: 1
                datawidth: 1
                technology: -1
                has_power_gating: false
                n_banks: 2
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                meshX: 1
                meshY: 16
                latency: "1ns"
                power_gated_at: null
            enabled: true
          - name: Registers[1..256]
            class: regfile
            attributes:
                depth: 1
                width: 8
                entries: 1
                datawidth: 8
                n_rdwr_ports: 2
                n_banks: 1
                meshX: 16
                meshY: 16
                has_power_gating: false
                cluster_size: 1
                reduction_supported: true
                multiple_buffering: 1
                min_utilization: 0
                allow_overbooking: false
                latency: "1ns"
                power_gated_at: null
                technology: "32nm"
            required_actions:
              - write
              - update
              - leak
              - read
            enabled: true
          - name: MAC[1..256]
            class: intmac
            attributes:
                multiplier_width: 8
                adder_width: 32
                meshX: 16
                meshY: 16
                has_power_gating: false
                latency: "1ns"
                power_gated_at: null
                technology: "32nm"
            required_actions:
              - compute
            enabled: true
architecture_constraints:
    targets:
      - type: temporal
        permutation: GQNSR
        target: DRAM
      - target: DRAM
        type: bypass
        keep:
          - Inputs
          - Outputs
          - Weights
      - target: Scratchpad
        type: temporal
        factors: D=1
        permutation: GQNSRD
      - target: Scratchpad
        type: bypass
        keep:
          - Inputs
          - Weights
        bypass:
          - Outputs
      - type: spatial
        factors: E=1,L=1,D=16
        permutation: GQNSRLE
        target: inter_PERows_spatial
      - factors: E=1,D=1,R=1,S=1,N=1,L=1,Q=1,G=1
        permutation: EDRSNLQG
        type: temporal
        target: inter_PERows_spatial
      - bypass:
          - Weights
          - Inputs
          - Outputs
        type: bypass
        target: inter_PERows_spatial
      - type: temporal
        permutation: GQNSR
        target: Accumulator
      - target: Accumulator
        type: bypass
        keep:
          - Outputs
        bypass:
          - Inputs
          - Weights
      - type: spatial
        factors: D=1,L=1,E=16
        permutation: GQNSRLD
        target: inter_PECols_spatial
      - factors: E=1,D=1,R=1,S=1,N=1,L=1,Q=1,G=1
        permutation: EDRSNLQG
        type: temporal
        target: inter_PECols_spatial
      - bypass:
          - Weights
          - Inputs
          - Outputs
        type: bypass
        target: inter_PECols_spatial
      - factors: E=1,D=1,L=16
        permutation: GQNSREDL
        type: temporal
        target: Registers
      - target: Registers
        type: bypass
        keep:
          - Weights
        bypass:
          - Inputs
          - Outputs
problem:
    version: '0.4'
    instance:
        N: 1
        E: 576
        H: 1
        W: 1
        G: 1
        R: 1
        S: 1
        Hdilation: 1
        Hstride: 1
        Wdilation: 1
        Wstride: 1
        D: 1536
        L: 512
        Q: 1
        densities: {}
    shape:
        name: KQV_matmul_encoder
        coefficients:
          - name: Wstride
            default: 1
          - name: Hstride
            default: 1
          - name: Wdilation
            default: 1
          - name: Hdilation
            default: 1
        data_spaces:
          - name: Weights
            projection:
              -   -   - E
              -   -   - D
              -   -   - R
              -   -   - S
              -   -   - G
            read_write: false
          - name: Inputs
            projection:
              -   -   - N
              -   -   - E
              -   -   - R
                      - Wdilation
                  -   - L
                      - Wstride
              -   -   - S
                      - Hdilation
                  -   - Q
                      - Hstride
              -   -   - G
            read_write: false
          - name: Outputs
            projection:
              -   -   - N
              -   -   - D
              -   -   - Q
              -   -   - L
              -   -   - G
            read_write: true
        dimensions:
          - E
          - D
          - R
          - S
          - N
          - L
          - Q
          - G
compound_components:
    version: '0.4'
    classes:
      - name: intmac
        attributes:
            technology: "must_specify"
            multiplier_width: "must_specify"
            adder_width: "must_specify"
            global_cycle_seconds: "must_specify"
        subcomponents:
          - name: intadder
            class: aladdin_adder
            attributes:
                width: adder_width
          - name: intmultiplier
            class: aladdin_adder
            attributes:
                width_a: multiplier_width
                width_b: multiplier_width
        actions:
          - name: compute
            subcomponents:
              - name: intadder
                actions:
                  - name: read
              - name: intmultiplier
                actions:
                  - name: read
          - name: leak
            subcomponents:
              - name: intadder
                actions:
                  - name: leak
              - name: intmultiplier
                actions:
                  - name: leak
      - name: smartbuffer_SRAM
        attributes:
            technology: "must_specify"
            width: "must_specify"
            depth: "must_specify"
            n_rw_ports: 1
            global_cycle_seconds: "must_specify"
        subcomponents:
          - name: storage
            class: SRAM
            attributes:
                width: width
                depth: depth
                n_rw_ports: n_rw_ports
                technology: technology
                global_cycle_seconds: global_cycle_seconds
          - name: address_generators[0..1]
            class: intadder
            attributes:
                n_bits: max(1, ceil(log2(depth))) if depth >= 1 else 1
                precision: max(1, ceil(log2(depth))) if depth >= 1 else 1
                datawidth: max(1, ceil(log2(depth))) if depth >= 1 else 1
                global_cycle_seconds: global_cycle_seconds
        actions:
          - name: write
            subcomponents:
              - name: storage
                actions:
                  - name: write
              - name: address_generators[0]
                actions:
                  - name: add
          - name: read
            subcomponents:
              - name: storage
                actions:
                  - name: read
              - name: address_generators[1]
                actions:
                  - name: add
          - name: leak
            subcomponents:
              - name: storage
                actions:
                  - name: leak
              - name: address_generators[0..1]
                actions:
                  - name: leak
          - name: update
            subcomponents:
              - name: storage
                actions:
                  - name: write
              - name: address_generators[0]
                actions:
                  - name: add
      - name: smartbuffer_metadata
        attributes:
            technology: "must_specify"
            width: "must_specify"
            depth: "must_specify"
            metadata_storage_width: "must_specify"
            metadata_storage_depth: "must_specify"
            n_rdwr_ports: 1
            metadata_counter_width: 0
        subcomponents:
          - name: storage
            class: smartbuffer_SRAM
            attributes:
                technology: technology
                width: width
                depth: depth
                n_rdwr_ports: n_rdwr_ports
          - name: metadata_storage
            class: smartbuffer_SRAM
            attributes:
                technology: technology
                width: metadata_storage_width
                depth: metadata_storage_depth
                n_rdwr_ports: n_rdwr_ports
          - name: metadata_counters[0..1]
            class: intadder
            attributes:
                technology: technology
                datawidth: metadata_counter_width
        actions:
          - name: read
            subcomponents:
              - name: storage
                actions:
                  - name: read
          - name: write
            subcomponents:
              - name: storage
                actions:
                  - name: write
          - name: update
            subcomponents:
              - name: storage
                actions:
                  - name: write
          - name: metadata_read
            subcomponents:
              - name: metadata_storage
                actions:
                  - name: read
          - name: metadata_write
            subcomponents:
              - name: metadata_storage
                actions:
                  - name: write
          - name: metadata_update
            subcomponents:
              - name: metadata_storage
                actions:
                  - name: write
          - name: leak
            subcomponents:
              - name: storage
                actions:
                  - name: leak
                    arguments:
                        global_cycle_seconds: global_cycle_seconds
              - name: metadata_storage
                actions:
                  - name: leak
                    arguments:
                        global_cycle_seconds: global_cycle_seconds
          - name: decompression_count
            subcomponents:
              - name: metadata_counters[1]
                actions:
                  - name: add
          - name: compression_count
            subcomponents:
              - name: metadata_counters[0]
                actions:
                  - name: add
      - name: regfile_metadata
        attributes:
            technology: "must_specify"
            width: "must_specify"
            depth: "must_specify"
            metadata_storage_width: "must_specify"
            metadata_storage_depth: "must_specify"
            metadata_counter_width: 0
        subcomponents:
          - name: storage
            class: smartbuffer_RF
            attributes:
                width: width
                depth: depth
          - name: metadata_storage
            class: smartbuffer_RF
            attributes:
                technology: technology
                width: metadata_storage_width
                depth: metadata_storage_depth
          - name: metadata_counters[0..1]
            class: intadder
            attributes:
                technology: technology
                datawidth: metadata_counter_width
        actions:
          - name: read
            subcomponents:
              - name: storage
                actions:
                  - name: read
          - name: write
            subcomponents:
              - name: storage
                actions:
                  - name: write
          - name: update
            subcomponents:
              - name: storage
                actions:
                  - name: write
          - name: metadata_read
            subcomponents:
              - name: metadata_storage
                actions:
                  - name: read
          - name: metadata_write
            subcomponents:
              - name: metadata_storage
                actions:
                  - name: write
          - name: metadata_update
            subcomponents:
              - name: metadata_storage
                actions:
                  - name: write
          - name: leak
            subcomponents:
              - name: storage
                actions:
                  - name: leak
                    arguments:
                        global_cycle_seconds: global_cycle_seconds
              - name: metadata_storage
                actions:
                  - name: leak
                    arguments:
                        global_cycle_seconds: global_cycle_seconds
          - name: decompression_count
            subcomponents:
              - name: metadata_counters[1]
                actions:
                  - name: add
          - name: compression_count
            subcomponents:
              - name: metadata_counters[0]
                actions:
                  - name: add
      - name: regfile
        attributes:
            technology: "must_specify"
            width: "must_specify"
            depth: "must_specify"
        subcomponents:
          - name: storage[1..width*depth]
            class: aladdin_register
            attributes:
                global_cycle_seconds: global_cycle_seconds
          - name: comparator[1..depth]
            class: aladdin_comparator
            attributes:
                n_bits: max(1, ceil(log2(depth)))
                global_cycle_seconds: global_cycle_seconds
        actions:
          - name: write
            subcomponents:
              - name: storage[1..width]
                actions:
                  - name: write
              - name: comparator[1..depth]
                actions:
                  - name: compare
          - name: read
            subcomponents:
              - name: storage[1..width]
                actions:
                  - name: read
              - name: comparator[1..depth]
                actions:
                  - name: compare
          - name: leak
            subcomponents:
              - name: storage[1..width*depth]
                actions:
                  - name: leak
                    arguments:
                        global_cycle_seconds: global_cycle_seconds
              - name: comparator[1..depth]
                actions:
                  - name: leak
                    arguments:
                        global_cycle_seconds: global_cycle_seconds
          - name: update
            subcomponents:
              - name: storage[1..width]
                actions:
                  - name: write
              - name: comparator[1..depth]
                actions:
                  - name: compare
      - name: smartbuffer_RF
        attributes:
            technology: "must_specify"
            width: "must_specify"
            depth: "must_specify"
            memory_width: max(32, width)
            memory_depth: max(64, depth)
            widthscale: width / memory_width
            depthscale: depth / memory_depth
            real_depth: depth
            area_scale: widthscale * depthscale
            dynamic_energy_scale: widthscale * (depthscale ** (1.56 / 2))
            static_energy_scale: area_scale
            n_rdwr_ports: 1
            global_cycle_seconds: "must_specify"
        subcomponents:
          - name: storage
            class: regfile
            area_scale: area_scale
            attributes:
                width: memory_width
                depth: memory_depth
                n_rdwr_ports: n_rdwr_ports
                global_cycle_seconds: global_cycle_seconds
          - name: address_generators[0..1]
            class: intadder
            attributes:
                n_bits: max(1, ceil(log2(real_depth))) if real_depth >= 1 else 1
                precision: max(1, ceil(log2(real_depth))) if real_depth >= 1 else
                    1
                datawidth: max(1, ceil(log2(real_depth))) if real_depth >= 1 else
                    1
                global_cycle_seconds: global_cycle_seconds
        actions:
          - name: write
            subcomponents:
              - name: storage
                actions:
                  - name: write
                    energy_scale: dynamic_energy_scale
              - name: address_generators[0]
                actions:
                  - name: add
          - name: read
            subcomponents:
              - name: storage
                actions:
                  - name: read
                    energy_scale: dynamic_energy_scale
              - name: address_generators[1]
                actions:
                  - name: add
          - name: leak
            subcomponents:
              - name: storage
                actions:
                  - name: leak
                    energy_scale: static_energy_scale
              - name: address_generators[0..1]
                actions:
                  - name: leak
          - name: update
            subcomponents:
              - name: storage
                actions:
                  - name: write
                    energy_scale: dynamic_energy_scale
              - name: address_generators[0]
                actions:
                  - name: add
mapping: []
mapper:
    optimization_metrics:
      - edp
      - delay
      - energy
    version: '0.4'
    live_status: false
    diagnostics: false
    emit_whoop_nest: true
    num_threads: 36
    timeout: 720
    victory_condition: 100
    sync_interval: 0
    out_prefix: timeloop-mapper
    optimization_metric: []
    search_size: null
    log_interval: 1
    log_oave_mappings: false
    log_all_mappings: false
    log_mappings_yaml: false
    log_mappings_verbose: false
    log_stats: false
    log_suboptimal: false
    penalize_consecutive_bypass_fails: false
    max_temporal_loops_in_a_mapping: -1
    algorithm: hybrid
    filter_revisits: false
    max_permutations_per_if_visit: 16
mapspace:
    version: '0.4'
    template: uber
globals:
    version: '0.4'
    environment_variables: {}
    expression_custom_functions: []
    accelergy_plug_ins: []
